{% extends 'base.html' %}

{% block content %}
<h2>Are you sure you want to delete {{ plant.name }}?</h2>

<form method="POST">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, Delete</button>
    <a href="/plants/{{ plant.id }}/detail/" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
