{% extends 'base.html' %}

{% load static %}

{% block content %}
<section>
    <div class="hero">
        <div class="search-box">
            <h1>Planteer</h1>
            <h3>Planteer Database For Plants Lovers</h3>
            <form class="d-flex" role="search" action="{% url 'plants:search_plant_view' %}" method="GET">
                <input class="form-control me-2" type="search" name="q" placeholder="Search For Plant">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </div>
</section>

<section>
    <div class="plant-section">
        <div class="top-section">
            <h2>Plants</h2>
            <h4 class="text-muted">Learn more about plants</h4>
        </div>
        <div class="more-plants">
            
            <a href="{% url 'plants:all_plants_view' %}"><p>More</p><span class="material-symbols-outlined">arrow_right_alt</span></a>
        </div>

        

    </div>
    
    {% include 'plants/card_plants.html' %}

</section>


{% endblock %}
