{% extends 'base.html' %}

{% block content %}
<h1>Messages from Users</h1>

{% for msg in messages %}
<div class="card mb-2">
    <div class="card-body">
        <h5>{{ msg.first_name }} {{ msg.last_name }}</h5>
        <p>{{ msg.message }}</p>
        <small>{{ msg.created_at }}</small>
    </div>
</div>
{% endfor %}

{% endblock %}
